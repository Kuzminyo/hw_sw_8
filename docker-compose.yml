services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # web UI: http://localhost:15672 (guest/guest)

  # Optional local MongoDB for development without Atlas:
  #   docker compose --profile local-mongo up -d
  #   MONGO_URI=mongodb://localhost:27017
  mongo:
    image: mongo:7
    profiles: ["local-mongo"]
    ports:
      - "27017:27017"
